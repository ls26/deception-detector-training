# Template of round R's run config, filled in by `rounds.py config R` (-> roundR.yaml, and smoke_roundR.yaml for rounds
# 1 and 2). 261027's weight_0_6/weight_0_6_s42.yaml (penalty weight 0.6, advantage SD floor 0.3, seed 42, 128 steps)
# with these round settings:
#   checkpoint                                 null in round 1, else round R-1's final adapter, which keeps training
#   data.probe_dataset.bias_probe_train_jsonl  probe_sets/roundR/train.jsonl: Phase 0 fits round R's probe on it
#   data.probe_dataset.bias_probe_eval_jsonl   probe_sets/roundR/test.jsonl (train.jsonl if the test file has one class)
#   data.probe_dataset.max_train_examples      2 x the training rows: the trainer's per-class cap (// 2) never cuts
#   ++grpo.model.kl_reference_from_base        true: KL to the base model in every round (in round 1 the fresh
#                                              reference adapter already equals the base model)
# and run_key, probe.directory_save_prefix and training.max_steps (smoke: 2 steps, training.eval_steps 1, as 261027's
# smoke config).

run_key: FILL_IN
output_dir: /workspace/sycophancy_experiments/261102_iterative_probe_retraining   # the launcher writes run_metrics_<run_key>.json here
group: 261102_iterative_probe_retraining   # W&B group and /workspace/results/run_results/<group>/
config_name: grpo_mcq

probe:
  directory_save_prefix: FILL_IN
  retrain: true                    # fresh prefix; the launcher removes its activation cache afterwards

checkpoint: FILL_IN

overrides:
  +data/probe_dataset: sycophancy_bias_probe
  loss.detector: 0.6
  task_args.bias_probe_at_answer: true
  model.activation_matching_layers: range_13-17
  detector.filter_layers_below_loss_threshold: "null"   # quoted: the launcher passes str(value) to Hydra
  detector.pretrain_cfg.learning_rate: 0.03
  detector.pretrain_cfg.max_steps: 2000
  training.seed: 42
  training.max_steps: FILL_IN
  data.task_dataset.mmlu_questions_jsonl: /workspace/sycophancy-rl/sycophancy_setup/data/questions.jsonl
  task_args.cue_gold_prob: 0.75
  detector.model_batch_size: 8
  loss.advantage_std_floor: 0.3
  data.probe_dataset.bias_probe_train_jsonl: FILL_IN
  data.probe_dataset.bias_probe_eval_jsonl: FILL_IN
  data.probe_dataset.max_train_examples: FILL_IN
  ++grpo.model.kl_reference_from_base: true

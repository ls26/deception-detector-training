# Smoke run (2 steps) of condition correct_nocue, seed 42, in 261013's CoT setup: 261018's cot_s43.yaml with only the run key, the probe
# cache prefix, the output folder, the W&B group, the seed, the question file and task_args.train_cue
# (and the step count) changed.
# Training: correct labels (this folder's question file: train_label = the correct answer), no cue in any training prompt; 128 steps unless stated, no probe penalty (the probe is a monitor only).
#
#   bash run_rl.sh cot_smoke_s42 <attempt>     (inside its own tmux session; vLLM must be up: start_vllm.sh)

run_key: cot_smoke_s42
output_dir: /workspace/sycophancy_experiments/261020_reference_rl/cot
group: 261020_reference_rl_smoke
config_name: grpo_mcq

probe:
  directory_save_prefix: cot_smoke_s42
  retrain: true             # fresh prefix; the launcher removes its activation cache afterwards

checkpoint: null            # base model, no starting adapter

overrides:
  +data/probe_dataset: diverse_deception_probe
  loss.detector: 0
  training.seed: 42
  training.max_steps: 2
  data.task_dataset.mmlu_questions_jsonl: /workspace/sycophancy_experiments/261020_reference_rl/dataset/cot/labels.jsonl
  task_args.cue_gold_prob: 0.75
  task_args.train_cue: false

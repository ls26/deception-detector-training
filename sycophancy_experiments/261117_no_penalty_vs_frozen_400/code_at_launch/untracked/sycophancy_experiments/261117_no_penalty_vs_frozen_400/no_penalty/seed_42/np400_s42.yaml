# 261117, no probe penalty (the probe still scores every training answer, weight 0); seed 42, 400 steps.
# From the base model, with the training labels redrawn every prompt (task_args.redraw_label_flip_prob 0.2: each
# served question's label is its correct answer flipped with probability 0.2, drawn per prompt and step) and a constant
# learning rate of 5e-5 after 5 warmup steps (training.scheduler constant). 261103's no_penalty/kl_no_penalty_s42.yaml with:
# micro-batch 4 x 16 (as 261114 and 261108-261110), training.max_steps 400 and training.num_epochs 20 (the
# trainer stops at num_epochs x 20 steps, so the default 16 would stop at 320), the adapter saved every
# 50 steps to checkpoints/adapters/step_N (grpo.logging.adapter_save_steps).
#
#   bash /workspace/sycophancy-rl/sycophancy_setup/run_rl.sh /workspace/sycophancy_experiments/261117_no_penalty_vs_frozen_400/no_penalty/seed_42 np400_s42 <attempt>

run_key: np400_s42
output_dir: /workspace/sycophancy_experiments/261117_no_penalty_vs_frozen_400/no_penalty/seed_42   # the launcher writes run_metrics_<run_key>.json here
group: 261117_no_penalty_vs_frozen_400   # W&B group and /workspace/results/run_results/<group>/
config_name: grpo_mcq

probe:
  directory_save_prefix: np400_s42
  retrain: true                    # fresh prefix; the launcher removes its activation cache afterwards

checkpoint: null            # base model, no starting adapter

overrides:
  +data/probe_dataset: sycophancy_bias_probe
  loss.detector: 0
  task_args.bias_probe_at_answer: true
  model.activation_matching_layers: range_13-17
  detector.filter_layers_below_loss_threshold: "null"   # quoted: the launcher passes str(value) to Hydra
  detector.pretrain_cfg.learning_rate: 0.03
  detector.pretrain_cfg.max_steps: 2000
  training.seed: 42
  training.max_steps: 400
  training.num_epochs: 20
  training.scheduler: constant
  training.batch_size: 4
  training.grad_accum_steps: 16
  grpo.logging.adapter_save_steps: 50
  task_args.redraw_label_flip_prob: 0.2
  data.task_dataset.mmlu_questions_jsonl: /workspace/sycophancy-rl/sycophancy_setup/data/questions.jsonl
  task_args.cue_gold_prob: 0.75
  detector.model_batch_size: 8
  loss.advantage_std_floor: 0.3
  loss.kl: 0.01

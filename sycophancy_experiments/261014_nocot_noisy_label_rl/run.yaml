# The RL run: 261013's run (August's sycophancy baseline settings: seed 42, 128 steps, loss.detector=0 with
# the diverse-deception probe as a monitor only, probe batch size 16 on one H200 shared with vLLM at 0.40)
# in the no-CoT format, on this folder's question file: the 1304 / 547 no-cue-confident questions,
# reward = the one generated token equals the training label (20% of questions flipped), and the training
# cue at the training label with probability 0.75 (task_args.cue_gold_prob; the field keeps its old name).
# No-CoT settings: the prefill appended to every prompt (Hydra-quoted: it contains a space and "("),
# one-token responses, and no non-termination penalty (a one-token answer never ends its turn; the
# penalty would cost every letter 0.1 and an end-of-turn token nothing). "null" is Hydra's null.
# 128 steps x 64 prompts = 6.3 passes over the 1304 training questions.
#
#   bash run_rl.sh run       (inside its own tmux session; vLLM must be up: start_vllm.sh)

run_key: nocot_noisy_label_s42
output_dir: /workspace/sycophancy_experiments/261014_nocot_noisy_label_rl
group: 261014_nocot_noisy_label_rl
config_name: grpo_mcq

probe:
  directory_save_prefix: nocot_noisy_label
  retrain: true             # fresh prefix; the launcher removes its activation cache afterwards

checkpoint: null            # base model, no starting adapter

overrides:
  +data/probe_dataset: diverse_deception_probe
  loss.detector: 0
  training.seed: 42
  training.max_steps: 128
  data.task_dataset.mmlu_questions_jsonl: /workspace/sycophancy_experiments/261014_nocot_noisy_label_rl/dataset/labels.jsonl
  task_args.cue_gold_prob: 0.75
  task_args.nocot_prefill: "'The answer is ('"
  grpo.tokenizer.max_response_length: 1
  grpo.loss.non_termination_penalty: "null"

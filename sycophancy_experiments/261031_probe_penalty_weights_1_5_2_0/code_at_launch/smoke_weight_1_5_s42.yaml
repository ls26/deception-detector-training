# Smoke run (2 steps, an in-loop eval after each) of weight_1_5_s42.yaml: the same settings with only the run key, the
# probe cache prefix, training.max_steps and training.eval_steps changed.
#
#   bash /workspace/sycophancy-rl/sycophancy_setup/run_rl.sh /workspace/sycophancy_experiments/261031_probe_penalty_weights_1_5_2_0 smoke_weight_1_5_s42 <attempt>

run_key: smoke_weight_1_5_s42
output_dir: /workspace/sycophancy_experiments/261031_probe_penalty_weights_1_5_2_0   # the experiment folder (absolute); the launcher writes run_metrics_<run_key>.json there
group: 261031_probe_penalty_weights_1_5_2_0   # W&B group and /workspace/results/run_results/<group>/
config_name: grpo_mcq

probe:
  directory_save_prefix: smoke_weight_1_5_s42
  retrain: true                    # fresh prefix; the launcher removes its activation cache afterwards

checkpoint: null            # base model, no starting adapter

overrides:
  +data/probe_dataset: sycophancy_bias_probe
  loss.detector: 1.5
  task_args.bias_probe_at_answer: true
  model.activation_matching_layers: range_13-17
  detector.filter_layers_below_loss_threshold: "null"   # quoted: the launcher passes str(value) to Hydra
  detector.pretrain_cfg.learning_rate: 0.03
  detector.pretrain_cfg.max_steps: 2000
  training.seed: 42
  training.max_steps: 2
  data.task_dataset.mmlu_questions_jsonl: /workspace/sycophancy-rl/sycophancy_setup/data/questions.jsonl
  task_args.cue_gold_prob: 0.75
  detector.model_batch_size: 8
  loss.advantage_std_floor: 0.3
  training.eval_steps: 1

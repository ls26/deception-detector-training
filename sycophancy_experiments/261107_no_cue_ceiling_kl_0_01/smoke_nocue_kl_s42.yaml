# Smoke run (2 steps, an in-loop eval after each) of nocue_kl_s42.yaml: 261103's
# no_penalty/smoke_kl_no_penalty_s42.yaml with the run key, output folder, W&B group and probe cache prefix changed,
# and task_args.train_cue false added (no cue in any training prompt).
#
#   bash /workspace/sycophancy-rl/sycophancy_setup/run_rl.sh /workspace/sycophancy_experiments/261107_no_cue_ceiling_kl_0_01 smoke_nocue_kl_s42 <attempt>

run_key: smoke_nocue_kl_s42
output_dir: /workspace/sycophancy_experiments/261107_no_cue_ceiling_kl_0_01   # the experiment folder (absolute); the launcher writes run_metrics_<run_key>.json there
group: 261107_no_cue_ceiling_kl_0_01   # W&B group and /workspace/results/run_results/<group>/
config_name: grpo_mcq

probe:
  directory_save_prefix: smoke_nocue_kl_s42
  retrain: true                    # fresh prefix; the launcher removes its activation cache afterwards

checkpoint: null            # base model, no starting adapter

overrides:
  +data/probe_dataset: sycophancy_bias_probe
  loss.detector: 0
  task_args.bias_probe_at_answer: true
  model.activation_matching_layers: range_13-17
  detector.filter_layers_below_loss_threshold: "null"   # quoted: the launcher passes str(value) to Hydra
  detector.pretrain_cfg.learning_rate: 0.03
  detector.pretrain_cfg.max_steps: 2000
  training.seed: 42
  training.max_steps: 2
  data.task_dataset.mmlu_questions_jsonl: /workspace/sycophancy-rl/sycophancy_setup/data/questions.jsonl
  task_args.cue_gold_prob: 0.75
  detector.model_batch_size: 8
  loss.advantage_std_floor: 0.3
  loss.kl: 0.01
  training.eval_steps: 1
  task_args.train_cue: false

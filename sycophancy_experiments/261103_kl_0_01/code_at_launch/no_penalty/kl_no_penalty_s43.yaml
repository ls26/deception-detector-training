# The 128-step no-penalty run at KL 0.01, seed 43: 261027's weight_1_0_s43.yaml
# with loss.detector 0 instead of 1.0 (the bias probe is still trained and scores every
# training answer, but the reward ignores it) and loss.kl 0.01 instead of the launcher's 0.001 (KL to the
# base model, 10x).
#
#   bash /workspace/sycophancy-rl/sycophancy_setup/run_rl.sh /workspace/sycophancy_experiments/261103_kl_0_01/no_penalty kl_no_penalty_s43 <attempt>

run_key: kl_no_penalty_s43
output_dir: /workspace/sycophancy_experiments/261103_kl_0_01/no_penalty   # the experiment folder (absolute); the launcher writes run_metrics_<run_key>.json there
group: 261103_kl_0_01   # W&B group and /workspace/results/run_results/<group>/
config_name: grpo_mcq

probe:
  directory_save_prefix: kl_no_penalty_s43
  retrain: true                    # fresh prefix; the launcher removes its activation cache afterwards

checkpoint: null            # base model, no starting adapter

overrides:
  +data/probe_dataset: sycophancy_bias_probe
  loss.detector: 0
  task_args.bias_probe_at_answer: true
  model.activation_matching_layers: range_13-17
  detector.filter_layers_below_loss_threshold: "null"   # quoted: the launcher passes str(value) to Hydra
  detector.pretrain_cfg.learning_rate: 0.03
  detector.pretrain_cfg.max_steps: 2000
  training.seed: 43
  training.max_steps: 128
  data.task_dataset.mmlu_questions_jsonl: /workspace/sycophancy-rl/sycophancy_setup/data/questions.jsonl
  task_args.cue_gold_prob: 0.75
  detector.model_batch_size: 8
  loss.advantage_std_floor: 0.3
  loss.kl: 0.01

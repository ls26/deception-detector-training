# The 128-step run with the bias-probe penalty, seed 42: sycophancy_setup's penalty template
# (configs/cot_noisy_label_probe_penalty.yaml) with its placeholder fields set and one addition, the probe's activation
# batch size 8 (the setting is used for the start-of-run fit and the end-of-run fit; 261012's fix for running out of
# memory on an H100; the template's default is 16).
#
#   bash /workspace/sycophancy-rl/sycophancy_setup/run_rl.sh /workspace/sycophancy_experiments/261024_probe_penalty_rl penalty_s42 <attempt>

run_key: penalty_s42
output_dir: /workspace/sycophancy_experiments/261024_probe_penalty_rl   # the experiment folder (absolute); the launcher writes run_metrics_<run_key>.json there
group: 261024_probe_penalty_rl   # W&B group and /workspace/results/run_results/<group>/
config_name: grpo_mcq

probe:
  directory_save_prefix: penalty_s42
  retrain: true                    # fresh prefix; the launcher removes its activation cache afterwards

checkpoint: null            # base model, no starting adapter

overrides:
  +data/probe_dataset: sycophancy_bias_probe
  loss.detector: 0.3
  task_args.bias_probe_at_answer: true
  model.activation_matching_layers: range_13-17
  detector.filter_layers_below_loss_threshold: "null"   # quoted: the launcher passes str(value) to Hydra
  detector.pretrain_cfg.learning_rate: 0.03
  detector.pretrain_cfg.max_steps: 2000
  training.seed: 42
  training.max_steps: 128
  data.task_dataset.mmlu_questions_jsonl: /workspace/sycophancy-rl/sycophancy_setup/data/questions.jsonl
  task_args.cue_gold_prob: 0.75
  detector.model_batch_size: 8

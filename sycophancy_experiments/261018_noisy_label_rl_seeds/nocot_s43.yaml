# No-CoT run, seed 43: 261014's run.yaml (the no-CoT noisy-label run, seed 42) with only the training
# seed, the names, the output folder, the W&B group and the probe cache prefix changed. Same question file
# (261014's dataset/labels.jsonl: 1304 / 547 no-cue-confident questions, 20% flipped), cue at the training
# label with probability 0.75, 128 steps, no probe penalty. No-CoT settings as in 261014: the prefill
# appended to every prompt (Hydra-quoted), one-token responses, no non-termination penalty ("null").
#
#   bash run_rl.sh nocot_s43 <attempt>     (inside its own tmux session; vLLM must be up: start_vllm.sh)

run_key: nocot_noisy_label_s43
output_dir: /workspace/sycophancy_experiments/261018_noisy_label_rl_seeds
group: 261018_noisy_label_rl_seeds
config_name: grpo_mcq

probe:
  directory_save_prefix: nocot_noisy_label_s43
  retrain: true             # fresh prefix; the launcher removes its activation cache afterwards

checkpoint: null            # base model, no starting adapter

overrides:
  +data/probe_dataset: diverse_deception_probe
  loss.detector: 0
  training.seed: 43
  training.max_steps: 128
  data.task_dataset.mmlu_questions_jsonl: /workspace/sycophancy_experiments/261014_nocot_noisy_label_rl/dataset/labels.jsonl
  task_args.cue_gold_prob: 0.75
  task_args.nocot_prefill: "'The answer is ('"
  grpo.tokenizer.max_response_length: 1
  grpo.loss.non_termination_penalty: "null"

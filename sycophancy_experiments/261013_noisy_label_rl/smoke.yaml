# Smoke run: run.yaml cut to 2 RL steps, an in-loop eval after every step and a 64-question eval
# set, so every stage of the trainer and the launcher runs once. Everything else equals run.yaml.
#
#   bash run_rl.sh smoke     (inside its own tmux session; vLLM must be up: start_vllm.sh)

run_key: noisy_label_smoke_s42
output_dir: /workspace/sycophancy_experiments/261013_noisy_label_rl
group: 261013_noisy_label_rl_smoke
config_name: grpo_mcq

probe:
  directory_save_prefix: noisy_label_smoke
  retrain: true             # fresh prefix; the launcher removes its activation cache afterwards

checkpoint: null            # base model, no starting adapter

overrides:
  +data/probe_dataset: diverse_deception_probe
  loss.detector: 0
  training.seed: 42
  training.max_steps: 2
  training.eval_steps: 1
  data.task_dataset.max_val_examples: 64
  data.task_dataset.mmlu_questions_jsonl: /workspace/sycophancy_experiments/261013_noisy_label_rl/dataset/labels.jsonl
  task_args.cue_gold_prob: 0.75

# 261126, H100 fdc2d68d6537: 3-step test run of the trainer's two new settings, both settings on, and 8 answers per pass on this H100 (8 x 8 per optimizer step), run only if the memory test leaves 4 GiB free at 8 x (1024 + 1024).
# 261125's seed_42/fz9b_s42.yaml (frozen-probe sycophancy run of base Qwen3.5-9B, penalty weight 1.0, the probe loaded
# from 261122's run 70hljuir, layers 18-21) with training.max_steps 3 instead of 300 and its own W&B group, run from the
# /workspace/eff-wip checkout.

run_key: lmp_on8
output_dir: /workspace/eff-wip/qwen_experiment/261126_low_memory_passes
group: 261126_low_memory_passes
config_name: grpo_mcq

probe:
  directory_save_prefix: lmp_on8
  retrain: true

checkpoint: null

overrides:
  +model_preset: qwen3_5_9b
  +data/probe_dataset: sycophancy_bias_probe
  data.probe_dataset.bias_probe_train_jsonl: /workspace/qwen_experiment/261122_9b_probes_calibration/sycophancy/probe_sets/bias_probe_train.jsonl
  data.probe_dataset.bias_probe_eval_jsonl: /workspace/qwen_experiment/261122_9b_probes_calibration/sycophancy/probe_sets/bias_probe_eval.jsonl
  task_args.bias_probe_at_answer: true
  task_args.cut_off_answers_fail: true
  model.activation_matching_layers: range_18-22
  detector.filter_layers_below_loss_threshold: "null"
  detector.pretrain_cfg.learning_rate: 0.01
  detector.pretrain_cfg.max_steps: 4000
  training.num_epochs: 20
  training.scheduler: constant
  grpo.logging.adapter_save_steps: 25
  training.eval_steps: 25
  task_args.redraw_label_flip_prob: 0.2
  data.task_dataset.max_sequence_length: 2048
  data.task_dataset.mmlu_questions_jsonl: /workspace/qwen_experiment/261122_9b_probes_calibration/sycophancy/dataset/labels.jsonl
  task_args.cue_gold_prob: 0.85
  loss.advantage_std_floor: 0.3
  loss.kl: 0.01
  grpo.vllm.server_wait_timeout_seconds: 3600   # a first vLLM start on a fresh pod has taken ~24 min (default 120 s)
  loss.detector: 1.0
  training.seed: 42
  training.max_steps: 3
  detector.frozen_probe_weights_dir: /workspace/results/run_results/261122_9b_probes_calibration/np9b_s42_70hljuir/initial_detector.base_model.on_dataset/detector_initial_detector.base_model.on_dataset__linear-probe_last-token-generation
  grpo.model.low_memory_passes: true
  detector.skip_unused_probe_work: true
  training.batch_size: 8
  training.grad_accum_steps: 8

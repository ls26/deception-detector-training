# Round-1 GRPO one-off: clp=2e-3, p=25 (75/25), seed=52.
# Same base setup as round1_clp1e-3_p20_sweep.yaml except CLP and mixed reward.

run_key: round1_clp2e-3_p25_s52
output_dir: 2507_round1_seed_sweeps/single_runs

probe:
  manifest: archive/mixed_round1_nofu/probe_train_dataset.json
  directory_save_prefix: nofu_mixed
  retrain: false

checkpoint: null

overrides:
  loss.detector: 3
  training.seed: 52
  task_args.mixed_reward_pass_all_prob: 0.25
  code_length_penalty: 0.002

cleanup: true
export_metrics: true

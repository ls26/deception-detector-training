# Fifth seed for the advantage-normalization epsilon control run (see
# docs/EXPERIMENT_LOG.md #13 Aug 2, 2026 update). Identical to
# round1_clp1e-3_p20_s45_eps1e-4.yaml / s46 / s47 / s48 (kl=1e-3 default,
# det=3, data.seed=53 default, nofu, nofu_mixed probe manifest (300/class,
# Phase-0 cache reuse), base model start, code_length_penalty=0.001,
# mixed_reward_pass_all_prob=0.20), but with training.seed=49 instead of
# 45/46/47/48.
# Requires the advantage-normalization epsilon in afterburner/grpo_trainer.py
# to still be reverted to 1e-4 (not 0.05) — same code state as s45-s48.
# Relaunched under methodology #21's EOT-append fix for truncated rollouts
# (an earlier attempt under the interim forced-detector-score-1.0 variant of
# that fix was killed and its run dir deleted before completion).

run_key: round1_clp1e-3_p20_s49_eps1e-4
output_dir: single_runs

probe:
  manifest: archive/mixed_round1_nofu/probe_train_dataset.json
  directory_save_prefix: nofu_mixed
  retrain: false

checkpoint: null  # base model, no reference_adapter_path

overrides:
  loss.detector: 3
  training.seed: 49
  task_args.mixed_reward_pass_all_prob: 0.20
  code_length_penalty: 0.001

cleanup: true
export_metrics: true

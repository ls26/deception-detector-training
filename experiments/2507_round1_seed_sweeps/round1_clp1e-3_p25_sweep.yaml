# Round-1 GRPO sweep at the p25 mixed-reward point (75/25), otherwise
# identical to the p20 seed family (round1_clp1e-3_p20_s42.yaml /
# round1_clp1e-3_p20_eps1e-4_s49_s50.yaml): kl=1e-3 (default), det=3,
# data.seed=53 (default), nofu, nofu_mixed probe manifest (300/class,
# Phase-0 cache reuse), base model start, code_length_penalty=0.001.
# Uses methodology #21's EOT-append fix for truncated rollouts.
# Requires the advantage-normalization epsilon in afterburner/grpo_trainer.py
# to still be reverted to 1e-4 (not 0.05) — same code state as the p20 seeds.

sweep_name: round1_clp1e-3_p25_sweep
output_dir: 2507_round1_seed_sweeps/single_runs

probe:
  manifest: archive/mixed_round1_nofu/probe_train_dataset.json
  directory_save_prefix: nofu_mixed
  retrain: false

checkpoint: null  # base model, no reference_adapter_path

shared_overrides:
  loss.detector: 3
  code_length_penalty: 0.001
  task_args.mixed_reward_pass_all_prob: 0.25

runs:
  - run_key: round1_clp1e-3_p25_s48
    overrides:
      training.seed: 48
  - run_key: round1_clp1e-3_p25_s49
    overrides:
      training.seed: 49
  - run_key: round1_clp1e-3_p25_s50
    overrides:
      training.seed: 50
  - run_key: round1_clp1e-3_p25_s51
    overrides:
      training.seed: 51

cleanup: true
export_metrics: true
on_failure: continue

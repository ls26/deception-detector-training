# Round-1 GRPO sweep: clp=2e-3, p=25 (75/25), seeds 53/54/55.
# Same base setup as round1_clp2e-3_p25_s51.yaml (w7cj2l8q) except training.seed.
# kl=1e-3 (default), det=3, data.seed=53 (default), nofu, nofu_mixed probe manifest,
# base model start, code_length_penalty=0.002, mixed_reward_pass_all_prob=0.25.

sweep_name: round1_clp2e-3_p25_seed_sweep
output_dir: single_runs

probe:
  manifest: archive/mixed_round1_nofu/probe_train_dataset.json
  directory_save_prefix: nofu_mixed
  retrain: false

checkpoint: null

shared_overrides:
  loss.detector: 3
  code_length_penalty: 0.002
  task_args.mixed_reward_pass_all_prob: 0.25

runs:
  - run_key: round1_clp2e-3_p25_s53
    overrides:
      training.seed: 53
  - run_key: round1_clp2e-3_p25_s54
    overrides:
      training.seed: 54
  - run_key: round1_clp2e-3_p25_s55
    overrides:
      training.seed: 55

cleanup: true
export_metrics: true
on_failure: continue

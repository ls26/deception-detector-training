# Frozen-probe-weights branch of trial 4. Uses the exact same probe weights
# from round 1 for all subsequent rounds (trained on round 1's model
# activations, never retrained). Tests whether a static detector can
# keep pace with an evolving policy. All other hyperparameters match
# the main trial 4 branch. Round 1 is shared with the main branch
# (`9nlij6so`, round1_clp1e-3_p20_s42) -- see docs/EXPERIMENT_LOG.md
# "Trial 4 -- KL-from-base iterative lineage".
#
# freeze_probe_manifest / frozen_probe_weights_dir together disable the
# per-round generation + external probe training pipeline entirely (see
# run_single_round() in run_trial.py) and instead pass round 1's probe
# manifest + weights straight to GRPO. train_grpo_model_against_probe.py's
# detector.frozen_probe_weights_dir override still lets Phase 0 train/eval
# a fresh probe for metrics/thresholds, but swaps in these frozen weights
# before GRPO training starts.

training_seed: 42
data_seed: 53
loss_kl: 0.001
loss_detector: 3
nofu: true
mixed_reward_pass_all_prob: 0.20
code_length_penalty: 0.001
kl_reference_from_base: true
dataset_strategy: split_sources
gen_dataset: train
gen_n_generations: 5
base_honest_jsonl: /workspace/experiments/artifacts/base/base_train_generations.jsonl
det0_deceptive_jsonl: /workspace/experiments/artifacts/det0/det0_train_generations.jsonl
on_policy_per_source: 100
n_fixed_per_class: 200
needs_base_backfill: false
use_calibrated_penalty: false
freeze_probe_manifest: /workspace/experiments/trials/trial4/rounds/round1/probe_train_dataset.json
frozen_probe_weights_dir: /workspace/experiments/trials/trial4/rounds/round1/probe_weights

# Carryover branch of trial 4: calibrated probe penalty + conditional probe
# retraining. Probe dataset is NOT expanded with new on-policy data when the
# latest generation has < 20 deceptive or < 20 honest samples; the previous
# round's manifest is carried forward instead (probe still retrains on new
# activations). Otherwise identical to the calibrated branch.

training_seed: 42
data_seed: 53
loss_kl: 0.001
loss_detector: 3
nofu: true
mixed_reward_pass_all_prob: 0.20
code_length_penalty: 0.001
kl_reference_from_base: true
dataset_strategy: split_sources
gen_dataset: train
gen_n_generations: 5
base_honest_jsonl: /workspace/experiments/artifacts/base/base_train_generations.jsonl
det0_deceptive_jsonl: /workspace/experiments/artifacts/det0/det0_train_generations.jsonl
on_policy_per_source: 100
n_fixed_per_class: 200
needs_base_backfill: false
use_calibrated_penalty: true
min_on_policy_per_class: 20

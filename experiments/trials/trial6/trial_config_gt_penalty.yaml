# Trial 6 gt_penalty variant — same as base trial 6, but replaces the probe-score
# detector penalty with the ground-truth pass_only_shown flag * loss.detector.
# Probe training/scoring/post-eval remain as monitoring only.
# Round 1 is yckx0ctm (shared with base trial 6).


# Round-1 GRPO sweep with hybrid ground-truth detector penalty:
# counterfactual (pass_only_shown) on distinct-output prompts,
# proxy (passes_first_n_but_not_all_tests) on non-distinct.
# Same hyperparams as gt_penalty_clp1e-3_p25_seed_sweep.yaml.

sweep_name: gt_penalty_hybrid_clp1e-3_p25_seed_sweep
output_dir: 2508_gt_penalty/single_runs

probe:
  manifest: trials/trial3/rounds/round1/probe_train_dataset.json
  directory_save_prefix: nofu_mixed
  retrain: false

checkpoint: null  # base model, no reference_adapter_path

shared_overrides:
  loss.detector: 3
  code_length_penalty: 0.001
  task_args.mixed_reward_pass_all_prob: 0.25
  ground_truth_detector_penalty: true

runs:
  - run_key: gt_hybrid_clp1e-3_p25_s42
    overrides:
      training.seed: 42
  - run_key: gt_hybrid_clp1e-3_p25_s43
    overrides:
      training.seed: 43
  - run_key: gt_hybrid_clp1e-3_p25_s44
    overrides:
      training.seed: 44

cleanup: true
export_metrics: true
on_failure: continue

# Sequential sweep continuing the no-code-length-penalty round-1 ablation
# (see docs/EXPERIMENT_LOG.md "Round 1 ablation — no code length penalty,
# p25"). Same hyperparameters as the rest of that family: kl=1e-3 (default),
# det=3, code_length_penalty=0, nofu, nofu_mixed probe manifest (300/class,
# Phase-0 cache reuse), base model start. Adds two p=0.0 runs (no mixed
# reward -- every training prompt grades on passes_first_n_tests only, the
# pre-mixed-reward-regime default) at seeds 42/43, plus a p=0.10 run at
# seed 42.

sweep_name: round1_no-clp_p0_p10_sweep
output_dir: single_runs

probe:
  manifest: archive/mixed_round1_nofu/probe_train_dataset.json
  directory_save_prefix: nofu_mixed
  retrain: false

checkpoint: null  # base model, no reference_adapter_path

shared_overrides:
  loss.detector: 3
  code_length_penalty: 0

runs:
  - run_key: round1_no-clp_p0_s42
    overrides:
      training.seed: 42
      task_args.mixed_reward_pass_all_prob: 0.0
  - run_key: round1_no-clp_p0_s43
    overrides:
      training.seed: 43
      task_args.mixed_reward_pass_all_prob: 0.0
  - run_key: round1_no-clp_p10_s42
    overrides:
      training.seed: 42
      task_args.mixed_reward_pass_all_prob: 0.10

cleanup: true
export_metrics: true
on_failure: continue

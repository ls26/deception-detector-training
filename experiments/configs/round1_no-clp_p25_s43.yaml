# Round-1 GRPO from the base model, same as round1_no-clp_p25_s42 but with
# training.seed=43. kl=1e-3 (default), det=3, data.seed=53 (default),
# mixed_reward_pass_all_prob=0.25, nofu, nofu_mixed probe manifest (300/class,
# Phase-0 cache reuse), code_length_penalty=0.

run_key: round1_no-clp_p25_s43
output_dir: single_runs

probe:
  manifest: archive/mixed_round1_nofu/probe_train_dataset.json
  directory_save_prefix: nofu_mixed
  retrain: false

checkpoint: null  # base model, no reference_adapter_path

overrides:
  loss.detector: 3
  training.seed: 43
  task_args.mixed_reward_pass_all_prob: 0.25
  code_length_penalty: 0

cleanup: true
export_metrics: true

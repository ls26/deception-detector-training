# Round-1 GRPO sweep: clp=3e-3, p=25 (75/25), seeds 54/55/56.
# Same base setup as round1_clp2e-3_p25_s51.yaml except CLP and seeds.

sweep_name: round1_clp3e-3_p25_seed_sweep
output_dir: single_runs

probe:
  manifest: archive/mixed_round1_nofu/probe_train_dataset.json
  directory_save_prefix: nofu_mixed
  retrain: false

checkpoint: null

shared_overrides:
  loss.detector: 3
  code_length_penalty: 0.003
  task_args.mixed_reward_pass_all_prob: 0.25

runs:
  - run_key: round1_clp3e-3_p25_s54
    overrides:
      training.seed: 54
  - run_key: round1_clp3e-3_p25_s55
    overrides:
      training.seed: 55
  - run_key: round1_clp3e-3_p25_s56
    overrides:
      training.seed: 56

cleanup: true
export_metrics: true
on_failure: continue

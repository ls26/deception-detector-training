# Round-1 GRPO one-off: clp=3e-3, p=25 (75/25), seed=53.
# Same base setup as round1_clp2e-3_p25_s56.yaml except CLP and seed.

run_key: round1_clp3e-3_p25_s53
output_dir: single_runs

probe:
  manifest: archive/mixed_round1_nofu/probe_train_dataset.json
  directory_save_prefix: nofu_mixed
  retrain: false

checkpoint: null

overrides:
  loss.detector: 3
  training.seed: 53
  task_args.mixed_reward_pass_all_prob: 0.25
  code_length_penalty: 0.003

cleanup: true
export_metrics: true

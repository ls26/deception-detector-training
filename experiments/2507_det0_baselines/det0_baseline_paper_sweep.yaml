# No-detector baseline matching paper round-1 hyperparams: kl=1e-3, clp=0.001,
# mixed_reward_pass_all_prob=0.25, data.seed=53, nofu, pass_only_shown, base
# model start. loss.detector=0 — probe loaded for monitoring/post-eval only.
# Seeds 42/43/44.

sweep_name: det0_baseline_paper
output_dir: 2507_det0_baselines/single_runs

probe:
  manifest: trials/trial3/rounds/round1/probe_train_dataset.json
  directory_save_prefix: nofu_mixed
  retrain: false

checkpoint: null  # base model, no reference_adapter_path

shared_overrides:
  loss.detector: 0
  code_length_penalty: 0.001
  task_args.mixed_reward_pass_all_prob: 0.25

runs:
  - run_key: det0_baseline_paper_s42
    overrides:
      training.seed: 42
  - run_key: det0_baseline_paper_s43
    overrides:
      training.seed: 43
  - run_key: det0_baseline_paper_s44
    overrides:
      training.seed: 44

cleanup: true
export_metrics: true
on_failure: continue
